# Pinned Doris 3.0.6.2 start_be.sh selects this JDK17 variable; JAVA_OPTS alone is overwritten.
mem_limit = 1500M
JAVA_OPTS_FOR_JDK_17="-Dfile.encoding=UTF-8 -Djol.skipHotspotSAAttach=true -Xms64m -Xmx256m -DlogPath=$LOG_DIR/jni.log -Xlog:gc*:$LOG_DIR/be.gc.log.$CUR_DATE:time,uptime:filecount=10,filesize=50M -Djavax.security.auth.useSubjectCredsOnly=false -Dsun.security.krb5.debug=true -Dsun.java.command=DorisBE -XX:-CriticalJNINatives -XX:+IgnoreUnrecognizedVMOptions --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.lang.invoke=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.nio.cs=ALL-UNNAMED --add-opens=java.base/sun.security.action=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED --add-opens=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.management/sun.management=ALL-UNNAMED -Darrow.enable_null_check_for_get=false"
# Small personal workload; limits checked against pinned tag 3.0.6.2 config.cpp.
brpc_num_threads = 8
# PInternalService eagerly creates all three pools, including Arrow Flight's
# pool when its listening port is disabled. Automatic defaults create >=768 threads.
brpc_heavy_work_pool_threads = 4
brpc_light_work_pool_threads = 4
brpc_arrow_flight_work_pool_threads = 4
arrow_flight_sql_port = -1
be_service_threads = 8
webserver_num_workers = 4
doris_scanner_thread_pool_thread_num = 4
doris_scanner_min_thread_pool_thread_num = 1
doris_max_remote_scanner_thread_pool_thread_num = 4
send_batch_thread_pool_thread_num = 4
fragment_mgr_asynic_work_pool_thread_num_min = 2
fragment_mgr_asynic_work_pool_thread_num_max = 8
pipeline_executor_size = 2
spill_io_thread_pool_thread_num = 2
num_buffered_reader_prefetch_thread_pool_min_thread = 1
num_buffered_reader_prefetch_thread_pool_max_thread = 4
num_s3_file_upload_thread_pool_min_thread = 1
num_s3_file_upload_thread_pool_max_thread = 4
min_nonblock_close_thread_num = 1
max_nonblock_close_thread_num = 4
min_s3_file_system_thread_num = 1
max_s3_file_system_thread_num = 4
