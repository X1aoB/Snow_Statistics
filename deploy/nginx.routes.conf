# Include in the chosen existing TLS virtual host only after candidate acceptance.
# Apply a request rate limit in the proxy's http context using an in-memory key.
# Do not enable access logs containing request URLs or IPs for analytics routes.
location = /analytics/v1/events {
    access_log off;
    client_max_body_size 64k;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_pass http://127.0.0.1:8100;
}
location = /analytics/public/v1/summary.json {
    access_log off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 5s;
    proxy_pass http://127.0.0.1:8100;
}
# No public route for /analytics/private/. Use SSH local forwarding + reader token.
