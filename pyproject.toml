[project]
name = "snow-statistics"
version = "0.1.0"
description = "Removable analytics and a reproducible data engineering laboratory"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.3", "httpx==0.28.1",
  "pydantic==2.11.5", "tzdata==2025.2",
]

[project.optional-dependencies]
lab = ["kafka-python==2.2.15", "pymysql[rsa]==1.1.1", "streamlit==1.45.1", "pandas==2.2.3"]
dev = ["pytest==8.3.5", "ruff==0.11.13"]

[project.scripts]
snow-stats = "snow_statistics.cli:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
