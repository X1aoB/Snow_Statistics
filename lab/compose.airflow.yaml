name: snow-lab-orchestration
services:
  airflow:
    build:
      context: ..
      dockerfile: lab/airflow.Dockerfile
      args:
        SPARK_IMAGE: ${SPARK_IMAGE:?}
        AIRFLOW_IMAGE: ${AIRFLOW_IMAGE:?}
    image: snow-airflow-spark:0.1.0
    command: standalone
    ports: ["127.0.0.1:8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__PARALLELISM: 1
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 1
      SNOW_ODS_PATH: ${SNOW_ODS_PATH:-hdfs://snow-control:9000/snow/ods/events}
      SNOW_WAREHOUSE_PATH: ${SNOW_WAREHOUSE_PATH:-hdfs://snow-control:9000/snow/warehouse}
    volumes:
      - ../orchestration/dags:/opt/airflow/dags:ro
      - ..:/opt/snow:ro
      - ./generated/hadoop:/etc/hadoop:ro
      - airflow:/opt/airflow
    mem_limit: 2g
    cpus: 1
volumes:
  airflow:
