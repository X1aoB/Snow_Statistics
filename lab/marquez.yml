# Marquez 0.50.0; configuration contains variable names, never credentials.
server:
  applicationConnectors:
    - type: http
      port: ${MARQUEZ_PORT:-5000}
  adminConnectors:
    - type: http
      port: ${MARQUEZ_ADMIN_PORT:-5001}
db:
  driverClass: org.postgresql.Driver
  url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  minSize: 1
  maxSize: 8
migrateOnStartup: true
search:
  enabled: false
graphql:
  enabled: false
logging:
  level: INFO
  appenders:
    - type: console
