name: snow-lab-analysis
services:
  datanode:
    extra_hosts:
      - snow-control:${CONTROL_IP:?}
      - snow-compute:${COMPUTE_IP:?}
      - snow-analysis:${ANALYSIS_IP:?}
    image: ${HADOOP_IMAGE:?}
    profiles: [batch]
    network_mode: host
    user: "0:0"
    environment:
      HADOOP_CONF_DIR: /etc/hadoop
      HADOOP_HEAPSIZE_MAX: "384"
      HDFS_DATANODE_OPTS: -Ddfs.datanode.hostname=${ANALYSIS_IP:?}
    volumes: [./generated/hadoop:/etc/hadoop:ro, datanode:/data/dn]
    entrypoint: [hdfs, datanode]
    mem_limit: 768m
  doris-fe:
    image: ${DORIS_FE_IMAGE:?}
    profiles: [olap]
    network_mode: host
    environment:
      FE_SERVERS: fe1:${ANALYSIS_IP:?}:9010
      FE_ID: 1
      SNOW_DORIS_IP: ${ANALYSIS_IP:?}
    # Official entrypoints append discovered network settings to their own conf.
    # Keep source templates read-only, copy overrides into the writable container.
    volumes: [doris-fe:/opt/apache-doris/fe/doris-meta, ./doris/fe.conf:/snow/fe.conf:ro]
    entrypoint: [bash, -ec]
    command:
      - |
        cat /snow/fe.conf >> /opt/apache-doris/fe/conf/fe.conf
        printf '\npriority_networks = %s/32\n' "$$SNOW_DORIS_IP" >> /opt/apache-doris/fe/conf/fe.conf
        exec bash init_fe.sh
    mem_limit: 2560m
    logging: &doris_logging
      driver: local
      options: {max-size: 5m, max-file: "3"}
  doris-be:
    image: ${DORIS_BE_IMAGE:?}
    profiles: [olap]
    network_mode: host
    environment:
      FE_SERVERS: fe1:${ANALYSIS_IP}:9010
      BE_ADDR: ${ANALYSIS_IP}:9050
      SNOW_DORIS_IP: ${ANALYSIS_IP:?}
    volumes: [doris-be:/opt/apache-doris/be/storage, ./doris/be.conf:/snow/be.conf:ro]
    entrypoint: [bash, -ec]
    command:
      - |
        cat /snow/be.conf >> /opt/apache-doris/be/conf/be.conf
        printf '\npriority_networks = %s/32\n' "$$SNOW_DORIS_IP" >> /opt/apache-doris/be/conf/be.conf
        exec bash entry_point.sh
    mem_limit: 5g
    logging: *doris_logging
  governance-db:
    image: ${POSTGRES_IMAGE:?}
    profiles: [governance]
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${LAB_GOVERNANCE_PASSWORD:?}
      POSTGRES_DB: marquez
    volumes: [governance-db:/var/lib/postgresql/data]
    mem_limit: 384m
  marquez:
    image: ${MARQUEZ_IMAGE:?}
    profiles: [governance]
    ports: ["127.0.0.1:5000:5000", "127.0.0.1:5001:5001"]
    environment:
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      POSTGRES_HOST: governance-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${LAB_GOVERNANCE_PASSWORD}
      POSTGRES_DB: marquez
    mem_limit: 1g
volumes:
  datanode:
  doris-fe:
  doris-be:
  governance-db:
